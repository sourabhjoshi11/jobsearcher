services:
  postgres:
    image: postgres:15-alpine
    container_name: jobalertbot_postgres
    environment:
      POSTGRES_USER: jobalert
      POSTGRES_PASSWORD: jobalert_dev_pw
      POSTGRES_DB: jobalertbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobalert -d jobalertbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jobalertbot_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
